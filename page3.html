<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Summary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Logo Placeholder -->
        <div class="logo-placeholder">
            <span>[ Logo Placeholder ]</span>
        </div>

        <header>
            <h1>Task Completed! 🎉</h1>
            <p>Great job staying focused and getting your work done.</p>
        </header>

        <!-- Summary Statistics Card -->
        <section class="card summary-card">
            <h2>Session Summary</h2>
            <div class="stat-row">
                <span>Total Breaks Taken:</span>
                <strong id="summary-breaks">0</strong>
            </div>
            <div class="stat-row">
                <span>Total Completed Tasks:</span>
                <strong id="summary-completed-tasks">0</strong>
            </div>
            <div class="stat-row score-row">
                <span>Current Score:</span>
                <strong id="summary-score">0 pts</strong>
            </div>
        </section>

        <div class="action-buttons">
            <a href="index.html" class="btn primary-btn">Back to Home</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
